version: '3.9'

services:
  backend:
    build: ./Backend
    container_name: developer-os-backend
    ports:
      - "8000:8000"
    working_dir: /app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./Backend:/app
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DEBUG: ${DEBUG:-True}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_OAUTH_REDIRECT: ${GITHUB_OAUTH_REDIRECT:-http://127.0.0.1:8000/api/github/callback/}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

  frontend:
    build: ./Frontend
    container_name: developer-os-frontend
    ports:
      - "5173:5173"
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./Frontend:/app
    depends_on:
      - backend
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://127.0.0.1:8000/api}
